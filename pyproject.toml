[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "causalshadow-gs"
version = "0.1.0"
description = "Data preparation for the CausalShadow-GS research project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inspection = ["Pillow>=9", "numpy>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]
